version: '3.8'
services:
  mongo:
    image: mongo:6
    restart: always
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
  api:
    build: .
    command: npm run dev
    environment:
      - MONGO_URI=mongodb://mongo:27017/invoicepro
      - JWT_SECRET=dev-secret
      - BCRYPT_SALT_ROUNDS=10
      - CORS_ORIGIN=http://localhost:5173
      - NODE_ENV=development
    ports:
      - "4000:4000"
    depends_on:
      - mongo
    volumes:
      - .:/app
      - /app/node_modules
volumes:
  mongo-data:
